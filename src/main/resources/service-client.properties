# Service client configuration.
# Read timeout of the default template (seconds).
org.coldis.library.service-client.timeout=9
# Connect timeout of the default template (seconds).
org.coldis.library.service-client.connect-timeout=3
# Time the default template waits for a pooled connection (seconds).
org.coldis.library.service-client.connection-request-timeout=5
org.coldis.library.service-client.always-sync=false
org.coldis.library.service-client.max-total=${AVAILABLE_CPUS_500X:4096}
org.coldis.library.service-client.default-max-per-route=${AVAILABLE_CPUS_10X:32}
org.coldis.library.service-client.close-idle=5
org.coldis.library.service-client.close-expired=true
# Pooled connections: how long one may stay idle and still be reused, at most (a
# shorter Keep-Alive header from the server wins). Below the 20s after which our
# servers (Tomcat) close idle connections, so the client never reuses a connection
# the server is closing.
org.coldis.library.service-client.connection-max-keep-alive=15s
# Pooled connections: how long one is kept, however used (it is then replaced by a
# new one, so new instances behind a host name get connections too).
org.coldis.library.service-client.connection-time-to-live=60s
# Pooled connections idle for longer than this are checked before they are reused.
org.coldis.library.service-client.connection-validate-after-inactivity=1s

# Endpoint balancing of generated clients: least-in-flight (power of two choices
# on requests in flight) or random.
org.coldis.library.service-client.balancing.strategy=least-in-flight
# How long an endpoint that failed to connect (or answered a cooldown status) is skipped.
org.coldis.library.service-client.balancing.failure-cooldown=10s
# Response statuses that also put the endpoint in its cooldown. None by default: between
# services a 5xx comes from the application (often passed up from a downstream service),
# not from the instance, so it says nothing about the instance's health.
org.coldis.library.service-client.balancing.cooldown-statuses=

# Failover of generated clients over their endpoint list. The list is read on every
# call; an empty one goes to the client's last non-empty list (warned once, calls
# counted in service.client.calls.on.last.endpoints) for at most
# last-endpoints-max-age, then the calls fail with no request, as they do when there
# never was a list. So emptying a list stops the calls after that age (or at once,
# after a restart).
org.coldis.library.service-client.failover.enabled=true
# How long a client's last non-empty endpoint list stands in for an empty one, counted
# from the client's last call that saw it non-empty (0 for no limit: calls, with their
# credentials and bodies, may then reach reassigned addresses with no time bound).
# 10m covers a deploy or a short time with no healthy instance, without calling
# addresses that may since belong to another instance for long.
org.coldis.library.service-client.failover.last-endpoints-max-age=10m
# Attempts per operation (capped by the number of endpoints).
org.coldis.library.service-client.failover.max-attempts=3
# Methods taken as idempotent when the operation does not say.
org.coldis.library.service-client.failover.idempotent-methods=GET,HEAD,OPTIONS
# Response statuses retried on the next endpoint (idempotent operations only). None by
# default: a 5xx passed up from a downstream service would be retried at every hop.
org.coldis.library.service-client.failover.retry-statuses=
# If read timeouts are retried on the next endpoint (idempotent operations only).
org.coldis.library.service-client.failover.retry-on-read-timeout=false
# Time budget of an operation, over all its attempts (0 for none). No further attempt
# starts once it is spent, and each attempt waits for a pooled connection, then for its
# connection, each no longer than what is left of it when the attempt starts (the read
# timeout of an attempt is never cut): the waits before a request is sent stay under the
# budget plus one connect timeout. The per-attempt cap needs the library's request
# factory, or a scope bean that applies the limit (appliesConnectionWaitLimit); another
# scope bean only stops further attempts.
# 10s is a little more than the read timeout (9s) and than one attempt's longest
# wait before its request is sent (pool 5s + connect 3s), so a first attempt is never
# cut and a retry still fits after a quick failure, while the waits before a request
# is sent no longer add up to 3 x 8s. A slow failure (a read timeout, a slow error) also
# spends it: with retry-on-read-timeout=true, set it above twice the read timeout (a
# warning is logged at startup otherwise). Operations cut short by it are counted in
# service.client.attempts.stopped.by.time.limit (tags target, reason). With it, a
# connect timeout starts the endpoint's cooldown on the first attempt only (later
# attempts' connect waits may be cut by it); other connection failures, on any. Keep
# it above the pool wait plus the connect timeout (warned at startup otherwise).
org.coldis.library.service-client.failover.max-total-time=10s

# Adaptive concurrency limit per target (generated client), in memory only. Per
# operation it holds one permit across the failover attempts and measures each attempt's
# latency and overload outcomes (read timeouts, no pooled connection in time, the
# overload statuses). Per window it learns a baseline latency (falls fast, rises slowly)
# and a limit: an overloaded window (latency over latency-tolerance x baseline, or at
# least 10% overload outcomes) lowers it (at most halving it, never under min); a healthy
# one with in flight at half the limit or more raises it by its square root (up to max).
# A healthy target over its limit raises it at once, so it is never limited except by
# max. The first 10 windows are a warm-up.
# Mode: off, observe (never rejects; counts what enforce would reject) or enforce
# (rejects only when overloaded and over the limit, before any request: 503
# service.client.concurrency.limit, retry in 1s; min always passes). A failure inside the
# limiter never fails a call. Per target: mode.<target>, min.<target>, max.<target>
# (read once, at the target's first call; a change needs a restart).
org.coldis.library.service-client.concurrency-limit.mode=observe
org.coldis.library.service-client.concurrency-limit.min=10
org.coldis.library.service-client.concurrency-limit.max=256
org.coldis.library.service-client.concurrency-limit.initial=20
# A window closes after this time and at least min-samples samples.
org.coldis.library.service-client.concurrency-limit.window=1s
org.coldis.library.service-client.concurrency-limit.min-samples=10
org.coldis.library.service-client.concurrency-limit.latency-tolerance=3.0
# Time constant of the rise of the baseline latency (a slower target becomes the new
# normal after about this time).
org.coldis.library.service-client.concurrency-limit.baseline-rise-time=10m
# Response statuses that are overload outcomes.
org.coldis.library.service-client.concurrency-limit.overload-statuses=429,503
# Suggested fixed limit per target: margin x the peak demand (rate x latency, or the
# in-flight peak) of the healthy windows of the last 24 hours. Logged (INFO) per target
# every log-interval (0 for never), and in the service.client.limit.suggested gauge.
org.coldis.library.service-client.concurrency-limit.suggestion.margin=2.0
org.coldis.library.service-client.concurrency-limit.suggestion.log-interval=15m

# Slack endpoint.
org.coldis.library.service-client.slack.endpoint=https://hooks.slack.com/services

# Request limit configuration.
rate.limit.configurable-limit=25
rate.limit.configurable-period=3
