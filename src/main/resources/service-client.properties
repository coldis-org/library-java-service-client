# Service client configuration.
# Read timeout of the default template (seconds).
org.coldis.library.service-client.timeout=9
# Connect timeout of the default template (seconds).
org.coldis.library.service-client.connect-timeout=3
# Time the default template waits for a pooled connection (seconds).
org.coldis.library.service-client.connection-request-timeout=5
org.coldis.library.service-client.always-sync=false
org.coldis.library.service-client.max-total=${AVAILABLE_CPUS_500X:4096}
org.coldis.library.service-client.default-max-per-route=${AVAILABLE_CPUS_10X:32}
org.coldis.library.service-client.close-idle=5
org.coldis.library.service-client.close-expired=true
# If the HTTP client re-sends a 503 (service unavailable) once, for any method, as its
# default did before (a 429 is always re-sent once). Off: between services a 503 usually
# comes from the application, and re-sending a POST may repeat work it already did.
# On, it applies to EVERY call the service makes through the library HTTP client (all
# generated clients and the default template, POST included; not per client or
# operation): turn it on only once the service's state-changing calls (payments,
# disbursements, contracts) are known to be idempotent. Each re-send is logged.
org.coldis.library.service-client.retry-service-unavailable=false
# Pooled connections: how long one may stay idle and still be reused, at most (a
# shorter Keep-Alive header from the server wins). Below the 20s after which our
# servers (Tomcat) close idle connections, so the client never reuses a connection
# the server is closing.
org.coldis.library.service-client.connection-max-keep-alive=15s
# Pooled connections: how long one is kept, however used (it is then replaced by a
# new one, so new instances behind a host name get connections too).
org.coldis.library.service-client.connection-time-to-live=60s
# Pooled connections idle for longer than this are checked before they are reused.
org.coldis.library.service-client.connection-validate-after-inactivity=1s

# Endpoint balancing of generated clients: least-in-flight (power of two choices
# on requests in flight) or random.
org.coldis.library.service-client.balancing.strategy=least-in-flight
# How long an endpoint that failed to connect (or answered a cooldown status) is skipped.
org.coldis.library.service-client.balancing.failure-cooldown=10s
# Response statuses that also put the endpoint in its cooldown. None by default: between
# services a 5xx comes from the application (often passed up from a downstream service),
# not from the instance, so it says nothing about the instance's health.
org.coldis.library.service-client.balancing.cooldown-statuses=

# Failover of generated clients over their endpoint list.
org.coldis.library.service-client.failover.enabled=true
# Attempts per operation (capped by the number of endpoints).
org.coldis.library.service-client.failover.max-attempts=3
# Methods taken as idempotent when the operation does not say.
org.coldis.library.service-client.failover.idempotent-methods=GET,HEAD,OPTIONS
# Response statuses retried on the next endpoint (idempotent operations only). None by
# default: a 5xx passed up from a downstream service would be retried at every hop.
org.coldis.library.service-client.failover.retry-statuses=
# If read timeouts are retried on the next endpoint (idempotent operations only).
org.coldis.library.service-client.failover.retry-on-read-timeout=false

# Slack endpoint.
org.coldis.library.service-client.slack.endpoint=https://hooks.slack.com/services

# Request limit configuration.
rate.limit.configurable-limit=25
rate.limit.configurable-period=3
