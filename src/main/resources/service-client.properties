# Service client configuration.
# Read timeout of the default template (seconds).
org.coldis.library.service-client.timeout=9
# Connect timeout of the default template (seconds).
org.coldis.library.service-client.connect-timeout=3
# Time the default template waits for a pooled connection (seconds).
org.coldis.library.service-client.connection-request-timeout=5
org.coldis.library.service-client.always-sync=false
org.coldis.library.service-client.max-total=${AVAILABLE_CPUS_500X:4096}
org.coldis.library.service-client.default-max-per-route=${AVAILABLE_CPUS_10X:32}
org.coldis.library.service-client.close-idle=5
org.coldis.library.service-client.close-expired=true

# Failover of generated clients over their endpoint list.
org.coldis.library.service-client.failover.enabled=true
# Attempts per operation (capped by the number of endpoints).
org.coldis.library.service-client.failover.max-attempts=3
# Methods taken as idempotent when the operation does not say.
org.coldis.library.service-client.failover.idempotent-methods=GET,HEAD,OPTIONS
# Response statuses retried on the next endpoint (idempotent operations only).
org.coldis.library.service-client.failover.retry-statuses=502,503,504
# If read timeouts are retried on the next endpoint (idempotent operations only).
org.coldis.library.service-client.failover.retry-on-read-timeout=false

# Slack endpoint.
org.coldis.library.service-client.slack.endpoint=https://hooks.slack.com/services

# Request limit configuration.
rate.limit.configurable-limit=25
rate.limit.configurable-period=3
